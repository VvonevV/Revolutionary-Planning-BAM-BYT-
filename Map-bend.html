/* RP map: real Eastern Freeway geometry (OpenStreetMap) at the Bulleen Bend.

   barrier = separate grey blocks, crash cushion = yellow/black, cones = orange, detour = purple. */
:root{--ink:#1D1D1B;--muted:#5A574F;--line:#D8D3C7;--ground:#F3F2EE;--amber:#E0A100;--red:#C8423B;--orange:#E39A2D;--green:#3E9B4F;--blue:#1D4F8A;--purple:#6B4FA0;color-scheme:light only}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:#1D1D1B;color:#F4F2EC;font-size:14px;flex-wrap:wrap}
#top b{font-weight:600}#top .sq{width:14px;height:14px;border-radius:3px;background:var(--amber);display:inline-block}
#top a{color:#F4F2EC;margin-left:auto;font-size:13px}
#top .sub{color:#B9B4A8;font-size:12px;font-family:"IBM Plex Mono",monospace}
body.embed #top{display:none}
#map{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab;background:var(--ground)}
#map.drag{cursor:grabbing}
svg#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;pointer-events:none}
#ov>*{pointer-events:auto}
.panel{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:12px}
#layers{left:12px;top:12px;padding:6px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:calc(100% - 90px)}
#layers .t{font-size:11px;letter-spacing:.06em;color:var(--muted)}
#layers label{display:flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
#layers input{width:16px;height:16px;margin:0;accent-color:#1D4F8A}
.sw{display:inline-block;width:14px;height:4px;border-radius:2px}
#scen{left:12px;top:56px;padding:4px;display:flex;gap:4px;align-items:center}
#scen .t{font-size:11px;color:var(--muted);padding:0 6px}
#scen button{height:30px;padding:0 10px;border-radius:8px;border:1px solid #CFCAC0;background:#fff;font:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
#scen button.on{background:#1D1D1B;color:#fff;border-color:#1D1D1B}
#zoom{right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;overflow:hidden;width:44px}
#zoom button{width:44px;height:40px;border:none;border-bottom:1px solid var(--line);background:#fff;font:inherit;font-size:20px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
#zoom button.s{font-size:10px;font-weight:600;height:32px}
#zoom .pct{font-size:10px;font-family:"IBM Plex Mono",monospace;text-align:center;padding:4px 0;color:var(--muted)}
#legendBtn{left:12px;bottom:28px;height:36px;padding:0 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
#legend{left:12px;bottom:72px;padding:10px 12px;width:290px;max-height:calc(100% - 150px);overflow:auto;display:none}
#legend.open{display:block}
#legend h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#legend .row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
#legend .row svg{flex:none}
#legend .grp{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:8px 0 2px}
#chips{right:66px;bottom:28px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;background:none;border:none;box-shadow:none;max-width:70%}
.chip{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--ink)}
.chip i{width:10px;height:10px;border-radius:5px;display:inline-block}
.card{position:absolute;right:66px;bottom:72px;width:330px;padding:12px 14px;font-size:12px;line-height:1.45;display:none}
.card.open{display:block}
.card h5{margin:0 0 6px;font-size:13px;display:flex;align-items:center;gap:6px}
.card .x{margin-left:auto;border:none;background:none;font-size:16px;cursor:pointer;color:var(--muted)}
.card ul{margin:4px 0 0;padding-left:16px}
.card .src{font-size:10px;color:var(--muted);margin-top:6px}
.card a{color:var(--blue)}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:11px;color:#6E695E;white-space:nowrap;pointer-events:none;font-weight:500;text-shadow:0 0 3px #F3F2EE,0 0 3px #F3F2EE,0 0 3px #F3F2EE}
.lbl.fwy{font-size:12px;color:#3A3935;font-weight:600;letter-spacing:.02em}
.lbl.river{color:#4E86B0;font-style:italic}
.tag{position:absolute;transform:translate(-50%,-50%);padding:2px 7px;background:#fff;border-radius:5px;font-size:11px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.eq{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;border:none;background:none;padding:0;font:inherit;cursor:pointer}
.eq .ic{width:30px;height:30px;border-radius:8px;background:#F2C230;border:2px solid #1D1D1B;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.eq .nm{padding:0 4px;background:#fff;border:1px solid var(--line);border-radius:4px;font-size:10px;font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.eq.sel .ic{border:3px solid var(--blue);outline:4px solid rgba(47,109,181,.35)}
.eq.crit .ic{background:#F7C9C2;border-color:var(--red)}
.eq.warn .ic{border-color:var(--orange)}
.pin{position:absolute;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;padding:3px 8px 3px 3px;background:#fff;border-radius:14px;font-size:11px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);border:2px solid var(--red)}
.pin b{font-weight:700}.pin .d{width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.pin.w{border-color:var(--orange)}.pin.w .d{background:var(--orange)}
#scale{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:10px;font-family:"IBM Plex Mono",monospace;color:var(--muted);display:flex;align-items:center;gap:6px;pointer-events:none}
#scale span{display:block;height:6px;border:1.5px solid #5A574F;border-top:none}
#attr{position:absolute;right:4px;bottom:4px;font-size:9px;color:var(--muted);background:rgba(255,255,255,.8);padding:1px 4px;border-radius:3px}
#north{position:absolute;right:18px;top:12px;width:32px;height:32px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
body.plan #layers,body.plan #north,body.plan #chips{display:none}
body.plan #scen{left:auto;right:12px;top:12px}
body.plan #scen .t,body.plan #scen .lg{display:none}
body.plan #zoom{top:auto;bottom:90px;transform:none}
body.plan #legendBtn{bottom:28px}
#drop{position:absolute;inset:8px;border:3px dashed #1D4F8A;border-radius:12px;background:rgba(47,109,181,.06);pointer-events:none;display:none;align-items:flex-start;justify-content:center;padding-top:70px}
#drop span{padding:6px 12px;background:#1D4F8A;color:#fff;border-radius:16px;font-size:13px;font-weight:600}
#drop.on{display:flex}
.eq.grab{cursor:grab}
#cam{position:absolute;width:300px;background:#1D1D1B;border:2px solid #1D1D1B;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translate(-50%,0)}
#cam .hd{display:flex;align-items:center;gap:6px;padding:5px 8px;color:#fff;font:600 11px "IBM Plex Mono",monospace}
#cam .hd i{width:8px;height:8px;border-radius:4px;background:#E5484D;display:inline-block;animation:blink 1.2s infinite}
#cam .hd button{margin-left:auto;border:none;background:none;color:#fff;font-size:15px;cursor:pointer}
#cam .ft{padding:5px 8px;color:#D8D3C7;font:11px "IBM Plex Mono",monospace;display:flex;justify-content:space-between;background:#111}
@keyframes blink{50%{opacity:.2}}
@media (max-width:640px){#legend{width:calc(100% - 24px)}.card{right:12px;left:12px;width:auto}#chips{right:12px;bottom:70px;max-width:calc(100% - 24px)}#legendBtn{bottom:28px}}

    P.items.forEach(function(it){ if(it.path) return; var p=sAt(it.ch,it.off); if(drag&&drag.id===it.id&&drag.moved) p=[drag.x,drag.y]; if(!vis(p)&&!(drag&&drag.id===it.id))return;
      var on = P.selId ? P.selId===it.id : P.selK===it.k;

function post(m){ try{ parent.postMessage(m,'*'); }catch(e){} }
function scaleOf(){ var r=mapEl.getBoundingClientRect(); return mapEl.offsetWidth?r.width/mapEl.offsetWidth:1; }
function toWorld(sx,sy){ return [(sx-W()/2)/V.k+V.cx,(sy-H()/2)/V.k+V.cy]; }
function project(x,y){ var best={d:1e18,ch:0,off:0}; for(var i=1;i<IN.length;i++){ var a=IN[i-1],b=IN[i],dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-a[0])*dx+(y-a[1])*dy)/L2)); var px=a[0]+dx*t,py=a[1]+dy*t,d=(x-px)*(x-px)+(y-py)*(y-py); if(d<best.d){ var L=Math.sqrt(L2), nx=-dy/L, ny=dx/L; best={d:d,ch:INC[i-1]+t*L,off:((x-px)*nx+(y-py)*ny)}; } }
  var o2=best.off/u(); o2=Math.max(-60,Math.min(60,o2)); return {ch:Math.round(best.ch),off:Math.round(o2*10)/10}; }

  LEG.map(function(r){ return r.length===1?'<div class="grp">'+r[0]+'</div>':'<div class="row"><svg width="32" height="18" viewBox="0 0 32 18">'+r[0]+'</svg>'+r[1]+'</div>'; }).join('')+
  '<div class="grp">Rule</div><div style="font-size:11px;color:#5A574F">Barrier and work area are separate items. A detour appears only when the closure stops traffic flow; a 1-of-3 lane closure keeps 2 lanes open, so no detour.</div>'; }

  var ids=Object.keys(ptrs); if(ids.length===2){var a=ptrs[ids[0]],b=ptrs[ids[1]]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),k:V.k};}});
mapEl.addEventListener('pointermove',function(e){ if(!ptrs[e.pointerId])return; var r=mapEl.getBoundingClientRect(), sc=mapEl.offsetWidth?r.width/mapEl.offsetWidth:1; ptrs[e.pointerId]=[e.clientX,e.clientY]; var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){var a=ptrs[ids[0]],b=ptrs[ids[1]], d=Math.hypot(a[0]-b[0],a[1]-b[1]); var mx=((a[0]+b[0])/2-r.left)/sc,my=((a[1]+b[1])/2-r.top)/sc; zoomAt((pinch.k*d/pinch.d)/V.k,mx,my); return;}
  if(last){ if(Math.abs(e.clientX-last[0])+Math.abs(e.clientY-last[1])>2) panMoved=true; V.cx-=(e.clientX-last[0])/sc/V.k; V.cy-=(e.clientY-last[1])/sc/V.k; last=[e.clientX,e.clientY]; render(); }});

mapEl.addEventListener('pointerup',up); mapEl.addEventListener('pointercancel',up);

Array.prototype.forEach.call(document.querySelectorAll('#layers input'),function(i){ i.checked=!!S.L[i.dataset.l]; i.onchange=function(){S.L[i.dataset.l]=i.checked; render(); cards();}; });
